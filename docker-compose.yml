services:

  mysql:
    image: mysql:5.7
    container_name: ecommerce_mysql

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ecommerce_db

    ports:
      - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql
      - ./dump:/docker-entrypoint-initdb.d

  app:
    build: .
    container_name: ecommerce_app

    depends_on:
      - mysql

    ports:
      - "8888:8080"

    environment:
      DB_HOST: mysql

volumes:
  mysql_data: